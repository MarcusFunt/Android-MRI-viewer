name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ] && [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent NIfTI and DICOM reference libraries
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 nibabel==5.3.2 pydicom==3.0.1
      - name: Test BrainSuite processing bridge (mocked Docker)
        run: python -m unittest discover -s tools/brainsuite_bridge -p "test_*.py"
      - name: Generate synthetic clinical-coordinate fixtures
        run: python scripts/qa/reference_interop.py generate app/build/reference-qa
      - name: Build, JVM tests, lint and instrumented test APK compilation
        env:
          NEUROVIEW_REFERENCE_FIXTURE_DIR: ${{ github.workspace }}/app/build/reference-qa
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Independently verify exported DICOM and NIfTI
        run: python scripts/qa/reference_interop.py verify app/build/reference-qa
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neuroview-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload synthetic reference QA outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: neuroview-synthetic-reference-qa
          path: app/build/reference-qa/
          retention-days: 14

  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Install compile Android SDK
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ] && [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Enable KVM access for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android 15 emulator UI smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            mkdir -p app/build/emulator-qa
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.marcusfunt.neuroview/.MainActivity
            sleep 5
            adb exec-out screencap -p > app/build/emulator-qa/home.png
      - name: Upload emulator home screenshot and test XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuroview-emulator-qa
          path: |
            app/build/emulator-qa/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
