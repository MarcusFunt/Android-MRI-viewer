name: Publish NeuroView v1.6 Alpha 2

# Releases the APK built by the exact successful Android CI run on main.
# One version-specific workflow avoids publishing untested PR artifacts.
on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: neuroview-v1.6-alpha2-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact successful CI source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Validate version, source and idempotence
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          grep -Fq 'versionCode = 23' app/build.gradle.kts
          grep -Fq 'versionName = "1.6 Alpha 2"' app/build.gradle.kts
          if gh release view "v1.6-alpha.2" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "v1.6-alpha.2 is already published; refusing to overwrite."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retrieve APK from the passed CI run
        if: steps.gate.outputs.already_published == 'false'
        uses: actions/download-artifact@v4
        with:
          name: neuroview-debug
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release

      - name: Create SHA-256 provenance and release notes
        if: steps.gate.outputs.already_published == 'false'
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          test -s release/app-debug.apk
          cp release/app-debug.apk release/NeuroView-v1.6-alpha2-debug.apk
          (cd release && sha256sum NeuroView-v1.6-alpha2-debug.apk > NeuroView-v1.6-alpha2-debug.apk.sha256)
          cat > release/notes.md <<EOF
          # NeuroView v1.6 Alpha 2

          **Experimental research and educational software only; not for medical diagnosis, clinical interpretation, treatment, or patient care.**

          This update merges the v1.6 unified gesture controls and native-voxel-grid/MPR image-quality work from PR #42.

          ## Highlights
          - One-finger slice navigation combined with two-finger pinch-to-zoom and pan.
          - Native-grid startup for likely 2D-like scans, with an unobtrusive native/oblique indicator.
          - Improved resampling and higher settled-image quality with reference tests.
          - Additional Android UI, geometry, memory-safety and GL lifecycle tests.
          - Visible magenta/cyan draw-order debug markers hidden in normal app use.

          ## Build provenance
          - Exact tested source SHA: `$TESTED_SHA`
          - [Successful Android CI run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$CI_RUN)
          - Android versionName: `1.6 Alpha 2`; versionCode: `23`.
          - The attached APK is **debug-signed**, not production-signed. Signature mismatch with a previous debug APK may prevent in-place updating. Uninstalling NeuroView deletes its app-private notes and catalog data. Back up important data before switching signing keys.
          - The APK and its SHA-256 checksum are attached.

          Physical-phone image-quality and navigation validation remains important before v1.6 stable.
          EOF

      - name: Publish GitHub prerelease for the tested commit
        if: steps.gate.outputs.already_published == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh release create "v1.6-alpha.2" \
            "release/NeuroView-v1.6-alpha2-debug.apk" \
            "release/NeuroView-v1.6-alpha2-debug.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TESTED_SHA" \
            --title "NeuroView v1.6 Alpha 2" \
            --notes-file "release/notes.md" \
            --prerelease
