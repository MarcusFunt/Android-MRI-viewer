name: Publish NeuroView v1.6 prerelease

on:
  push:
    tags:
      - 'v1.6.0-alpha.4'

permissions:
  contents: read

concurrency:
  group: neuroview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify tag, source and Android version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          grep -Fq 'versionCode = 25' app/build.gradle.kts
          grep -Fq 'versionName = "1.6.0-alpha.4"' app/build.gradle.kts
          test "$GITHUB_REF_NAME" = "v1.6.0-alpha.4"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ] && [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install independent NIfTI and DICOM reference libraries
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 nibabel==5.3.2 pydicom==3.0.1

      - name: Run mocked BrainSuite bridge tests
        run: python -m unittest discover -s tools/brainsuite_bridge -p "test_*.py"

      - name: Generate synthetic clinical-coordinate fixtures
        run: python scripts/qa/reference_interop.py generate app/build/reference-qa

      - name: Build debug checks, release candidate, run JVM tests and lint
        env:
          NEUROVIEW_REFERENCE_FIXTURE_DIR: ${{ github.workspace }}/app/build/reference-qa
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Verify exported DICOM and NIfTI independently
        run: python scripts/qa/reference_interop.py verify app/build/reference-qa

      - name: Enable KVM access for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 15 instrumentation suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Prepare unsigned candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          source_apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$source_apk"
          mkdir -p unsigned-candidate
          cp "$source_apk" unsigned-candidate/NeuroView-v1.6.0-alpha.4-unsigned.apk
          (cd unsigned-candidate && sha256sum NeuroView-v1.6.0-alpha.4-unsigned.apk > NeuroView-v1.6.0-alpha.4-unsigned.apk.sha256)

      - name: Upload unsigned candidate for isolated signing
        uses: actions/upload-artifact@v4
        with:
          name: neuroview-v1.6.0-alpha.4-unsigned-candidate
          path: unsigned-candidate/
          if-no-files-found: error
          retention-days: 14

  sign:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: neuroview-signing
    steps:
      - name: Download verified unsigned candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: neuroview-v1.6.0-alpha.4-unsigned-candidate
          path: unsigned-candidate

      # Pin runner setup actions executed before the protected signing step.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android signing tools
        run: sdkmanager --install "build-tools;36.0.0"

      - name: Sign and verify APK with the protected stable identity
        shell: bash
        env:
          NEUROVIEW_RELEASE_KEYSTORE_BASE64: ${{ secrets.NEUROVIEW_RELEASE_KEYSTORE_BASE64 }}
          NEUROVIEW_RELEASE_STORE_PASSWORD: ${{ secrets.NEUROVIEW_RELEASE_STORE_PASSWORD }}
          NEUROVIEW_RELEASE_KEY_ALIAS: ${{ secrets.NEUROVIEW_RELEASE_KEY_ALIAS }}
          NEUROVIEW_RELEASE_KEY_PASSWORD: ${{ secrets.NEUROVIEW_RELEASE_KEY_PASSWORD }}
          NEUROVIEW_RELEASE_CERT_SHA256: ${{ vars.NEUROVIEW_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$NEUROVIEW_RELEASE_KEYSTORE_BASE64"
          test -n "$NEUROVIEW_RELEASE_STORE_PASSWORD"
          test -n "$NEUROVIEW_RELEASE_KEY_ALIAS"
          test -n "$NEUROVIEW_RELEASE_KEY_PASSWORD"
          [[ "$NEUROVIEW_RELEASE_CERT_SHA256" =~ ^[[:xdigit:]]{64}$ ]]

          unsigned=unsigned-candidate/NeuroView-v1.6.0-alpha.4-unsigned.apk
          (cd unsigned-candidate && sha256sum --check NeuroView-v1.6.0-alpha.4-unsigned.apk.sha256)
          test -s "$unsigned"
          mkdir -p release
          signed=release/NeuroView-v1.6.0-alpha.4.apk
          signing_dir="$RUNNER_TEMP/neuroview-signing-$GITHUB_RUN_ID"
          mkdir -m 700 "$signing_dir"
          trap 'unset APKSIGNER_STORE_PASSWORD APKSIGNER_KEY_PASSWORD; rm -rf "$signing_dir"' EXIT
          key_path="$signing_dir/upload.jks"
          umask 077

          keystore_b64="$NEUROVIEW_RELEASE_KEYSTORE_BASE64"
          store_password="$NEUROVIEW_RELEASE_STORE_PASSWORD"
          key_alias="$NEUROVIEW_RELEASE_KEY_ALIAS"
          key_password="$NEUROVIEW_RELEASE_KEY_PASSWORD"
          expected_cert_sha256="$(printf '%s' "$NEUROVIEW_RELEASE_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          unset NEUROVIEW_RELEASE_KEYSTORE_BASE64 NEUROVIEW_RELEASE_STORE_PASSWORD NEUROVIEW_RELEASE_KEY_ALIAS NEUROVIEW_RELEASE_KEY_PASSWORD
          printf '%s' "$keystore_b64" | base64 --decode > "$key_path"
          unset keystore_b64
          test -s "$key_path"

          export APKSIGNER_STORE_PASSWORD="$store_password"
          export APKSIGNER_KEY_PASSWORD="$key_password"
          unset store_password key_password
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" sign --ks "$key_path" --ks-key-alias "$key_alias" \
            --ks-pass env:APKSIGNER_STORE_PASSWORD --key-pass env:APKSIGNER_KEY_PASSWORD \
            --out "$signed" "$unsigned"
          unset APKSIGNER_STORE_PASSWORD APKSIGNER_KEY_PASSWORD key_alias

          "$apksigner" verify --verbose --print-certs "$signed" > release/apksigner-identity.txt
          cert_sha256="$(grep -m1 'Signer #1 certificate SHA-256 digest:' release/apksigner-identity.txt | awk -F': ' '{print tolower($2)}')"
          test -n "$cert_sha256"
          if [[ "$cert_sha256" != "$expected_cert_sha256" ]]; then
            echo "The APK certificate does not match the configured stable release identity." >&2
            exit 1
          fi
          (cd release && sha256sum NeuroView-v1.6.0-alpha.4.apk > NeuroView-v1.6.0-alpha.4.apk.sha256)
          cat > release/provenance.txt <<EOF
          Release tag: $GITHUB_REF_NAME
          Source commit: $GITHUB_SHA
          Android versionName: 1.6.0-alpha.4
          Android versionCode: 25
          GitHub Actions run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Unsigned candidate SHA-256: $(awk '{print $1}' unsigned-candidate/NeuroView-v1.6.0-alpha.4-unsigned.apk.sha256)
          APK SHA-256: $(awk '{print $1}' release/NeuroView-v1.6.0-alpha.4.apk.sha256)
          Signing certificate SHA-256: $cert_sha256
          Signature verification: apksigner verify --verbose --print-certs passed
          EOF
          cat > release/notes.md <<'EOF'
          **Experimental research and educational software only. Not for medical diagnosis, clinical interpretation, treatment, or patient care.**

          NeuroView v1.6.0 Alpha 4 adds versioned local scan-note backup and merge import with explicit sensitive-data warnings, duplicate/conflict preservation, and confirmed manual scan relinking. Notes backups contain text and limited scan metadata, never MRI voxels or document-provider links.

          This prerelease is signed with the project's protected stable Android release key. Review the attached provenance and SHA-256 file. Installing a build signed by a different certificate may require an export and uninstall; uninstalling removes app-private catalog and note data. Back up notes before changing signing identity.

          DICOM conversion remains limited to supported uncompressed, single-frame monochrome data. NIfTI-to-DICOM creates derived Secondary Capture objects. Physical-device/reference-viewer validation is still required; this software is not clinically validated.
          EOF

      - name: Upload signed candidate for the release approval gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neuroview-v1.6.0-alpha.4-signed-candidate
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment: neuroview-prerelease
    steps:
      - name: Download verified signed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: neuroview-v1.6.0-alpha.4-signed-candidate
          path: release

      - name: Publish the tag-bound GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace the existing release $GITHUB_REF_NAME." >&2
            exit 1
          fi
          (cd release && sha256sum --check NeuroView-v1.6.0-alpha.4.apk.sha256)
          gh release create "$GITHUB_REF_NAME" \
            release/NeuroView-v1.6.0-alpha.4.apk \
            release/NeuroView-v1.6.0-alpha.4.apk.sha256 \
            release/provenance.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --verify-tag \
            --title "NeuroView 1.6.0 Alpha 4" \
            --notes-file release/notes.md \
            --prerelease
