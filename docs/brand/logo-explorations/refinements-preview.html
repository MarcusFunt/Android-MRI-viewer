<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NeuroView logo refinements</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: #16181d; color: #edf0f2; font: 15px/1.5 "Segoe UI", sans-serif; }
  h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
  p { margin: 0 0 24px; color: #aeb5bf; }
  main { display: grid; grid-template-columns: repeat(2, minmax(280px, 1fr)); gap: 18px; max-width: 1040px; }
  article { padding: 20px; border: 1px solid #343840; border-radius: 16px; background: #202329; }
  h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .num { color: #aeb5bf; margin-right: 8px; }
  figure { margin: 16px 0 0; aspect-ratio: 1; display: grid; place-items: center; border-radius: 12px; background: #101216; }
  img { display: block; width: 86%; height: 86%; }
  footer { margin-top: 18px; color: #89919c; font-size: 13px; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } body { padding: 20px; } }
</style>
<h1>NeuroView · logo refinements</h1>
<p>The dark panels are preview surfaces only. Both SVG marks have transparent backgrounds.</p>
<main>
  <article>
    <h2><span class="num">1</span>Etched axial brain</h2>
    <figure><img src="neuroview-axial-etched-refined.svg" alt="White etched-line axial brain mark"></figure>
    <footer>Linework refinement of your current favorite.</footer>
  </article>
  <article>
    <h2><span class="num">4</span>Aperture silhouette</h2>
    <figure><img src="neuroview-axial-aperture-refined.svg" alt="White axial brain silhouette with thin circular outline"></figure>
    <footer>Transparent silhouette refinement of the earlier #4 direction.</footer>
  </article>
</main>
</html>
